name: harness-tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.12"]
        include:
          - os: ubuntu-24.04   # Python 3.9 builds are not published for newer Ubuntu images
            python: "3.9"
    env:
      CARGO_TERM_COLOR: never
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install bubblewrap (Linux sandbox)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q bubblewrap
          # Ubuntu 24.04 restricts unprivileged user namespaces through AppArmor; bwrap needs them.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          bwrap --ro-bind / / true && echo "bwrap usable"

      - name: Install pytest
        run: python -m pip install --upgrade pip pytest

      - name: Harness test-suite
        run: python -m pytest -q -ra --durations=15

      - name: Launchers smoke test (POSIX)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          T="$RUNNER_TEMP/launcher-smoke"
          git init -q "$T"
          ./setup.sh "$T" --profile balanced
          "$T/agentwork/scripts/launch.sh" --selftest
          (cd "$T" && python agentwork/pipeline.py doctor) || true

      - name: Launchers smoke test (Windows cmd)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          set T=%RUNNER_TEMP%\launcher-smoke
          git init -q "%T%"
          call setup.cmd "%T%" --profile balanced || exit /b 1
          call "%T%\agentwork\scripts\launch.cmd" --selftest || exit /b 1

  mutants:
    name: cargo-mutants (real run, Linux)
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants
      - run: cargo mutants --version
      - run: python -m pip install pytest
      - name: Real cargo-mutants gate (must not be skipped)
        run: |
          python -m pytest -q -ra tests/test_e2e_rust.py -k mutants | tee mutants.log
          grep -q "2 passed" mutants.log
